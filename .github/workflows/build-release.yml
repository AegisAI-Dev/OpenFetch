name: Build and Release OpenFetch (compliance-gated)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact numeric release version, for example 3.0.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce licensing release gate
        shell: pwsh
        run: |
          $ownership = Get-Content -Raw -LiteralPath "PROJECT-METADATA.json" | ConvertFrom-Json
          $notices = Get-Content -Raw -LiteralPath "THIRD_PARTY_NOTICES.md"
          $inventory = Get-Content -Raw -LiteralPath "THIRD_PARTY_LICENSES.txt"
          $sourcePlan = Get-Content -Raw -LiteralPath "docs\DEPENDENCY-SOURCE.md"
          $blockers = @()
          if ($ownership.public_author_and_copyright_holder -ne "0xRootNull") {
            $blockers += "Project copyright owner is not supplied"
          }
          if ($ownership.development_started -ne 2025) {
            $blockers += "Copyright start year is not supplied"
          }
          if ($ownership.copyright_period -ne "2025-2026") {
            $blockers += "Copyright year range is not supplied"
          }
          if ($ownership.public_attribution -ne "0xRootNull") {
            $blockers += "Public attribution is not supplied"
          }
          if (
            $ownership.project_license -ne "MIT for project-owned portions" -or
            $ownership.mit_licensing_intent -ne "explicitly confirmed"
          ) {
            $blockers += "MIT licensing intent is not explicitly confirmed"
          }
          if (
            $null -ne $ownership.registered_company_or_legal_entity -or
            $null -ne $ownership.employer_client_or_commissioning_party
          ) {
            $blockers += "A company, employer, client, or commissioning ownership claim remains"
          }
          if ($ownership.known_other_human_contributors.Count -ne 0) {
            $blockers += "An additional human contributor claim remains"
          }
          if ($notices -notmatch '(?m)^Release-gate-status: PASS\s*$') {
            $blockers += "THIRD_PARTY_NOTICES.md is not explicitly marked PASS"
          }
          if ($inventory -notmatch '(?m)^Release-gate-status: PASS\s*$') {
            $blockers += "THIRD_PARTY_LICENSES.txt is not explicitly marked PASS"
          }
          if ($inventory -notmatch '(?m)^Audit-blocker-count: 0\s*$') {
            $blockers += "THIRD_PARTY_LICENSES.txt does not declare zero audited blockers"
          }
          if ($sourcePlan -notmatch '(?m)^Release-gate-status: PASS\s*$') {
            $blockers += "docs/DEPENDENCY-SOURCE.md is not explicitly marked PASS"
          }
          foreach ($reviewedDocument in @(
            @{ Name = "THIRD_PARTY_NOTICES.md"; Text = $notices },
            @{ Name = "THIRD_PARTY_LICENSES.txt"; Text = $inventory },
            @{ Name = "docs/DEPENDENCY-SOURCE.md"; Text = $sourcePlan }
          )) {
            if ($reviewedDocument.Text -notmatch '(?m)^Qualified-review-status: PASS\s*$') {
              $blockers += "$($reviewedDocument.Name) has no qualified-review PASS record"
            }
          }
          foreach ($required in @(
            "uv.lock",
            "requirements.lock",
            "PROJECT-METADATA.json",
            "SOURCE-HASHES.sha256",
            "licenses\RELEASE-LICENSE-MANIFEST.sha256",
            "docs\BUILD-REPRODUCIBILITY.md",
            "docs\COPYRIGHT-OWNERSHIP-QUESTIONS.md",
            "docs\LGPL-COMPLIANCE.md",
            "docs\OPTIONAL-PO-PROVIDER.md",
            "docs\PROJECT-OWNERSHIP-DECLARATION.md"
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              $blockers += "Required release input is missing: $required"
            }
          }
          if ($blockers.Count -gt 0) {
            $blockers | ForEach-Object { Write-Host "::error::$_" }
            Write-Error "Licensing audit status is HOLD. Public build/release is blocked."
            exit 1
          }

      - name: Stage pinned CPython runtime
        shell: pwsh
        run: |
          $asset = "cpython-3.12.9+20250317-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          $expectedSha256 = "ee338839315bdd8af5fc935f9595eca20ebebdd250726c5816b2d0cf94d1e661"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $runtime = Join-Path $env:RUNNER_TEMP "openfetch-python-3.12.9-20250317"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/20250317/$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "Pinned CPython archive checksum mismatch."
            exit 1
          }
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          tar -xzf $archive -C $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $runtime "python\python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            Write-Error "Pinned CPython archive layout changed."
            exit 1
          }
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Validate release version
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.ref_name }}" -ne "${{ github.event.repository.default_branch }}") {
            Write-Error "Manual releases must run from the repository default branch."
            exit 1
          }
          $releaseRef = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          & $env:PYTHON_EXE scripts/release_tools.py validate --release-ref $releaseRef
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $releaseRef -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require a new tag for manual releases
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release.outputs.tag }}';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.setFailed(`Tag ${tag} already exists. Use a new source version or the tag-triggered workflow.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Install dependencies
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m ensurepip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage verified bundled runtimes
        shell: pwsh
        run: |
          $ffmpegVersion = "autobuild-2026-06-30-13-34"
          $ffmpegAsset = "ffmpeg-N-125365-g9a01c1cb6a-win64-gpl.zip"
          $ffmpegSha256 = "52c0383c460f0ec1039088f1591921fb82e3b870b32aab8faf2ff1e5ae14bf9d"
          $archive = Join-Path $env:RUNNER_TEMP $ffmpegAsset
          $expanded = Join-Path $env:RUNNER_TEMP "openfetch-ffmpeg"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$ffmpegVersion/$ffmpegAsset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $ffmpegSha256) {
            Write-Error "Pinned FFmpeg archive checksum mismatch."
            exit 1
          }
          Expand-Archive -Path $archive -DestinationPath $expanded -Force
          $ffmpeg = @(Get-ChildItem $expanded -Recurse -File -Filter ffmpeg.exe)
          $ffprobe = @(Get-ChildItem $expanded -Recurse -File -Filter ffprobe.exe)
          if ($ffmpeg.Count -ne 1 -or $ffprobe.Count -ne 1) {
            Write-Error "Pinned FFmpeg archive did not contain exactly one ffmpeg.exe and ffprobe.exe."
            exit 1
          }
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          Copy-Item $ffmpeg[0].FullName bin\ffmpeg.exe -Force
          Copy-Item $ffprobe[0].FullName bin\ffprobe.exe -Force
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          Copy-Item $node bin\node.exe -Force
          & bin\node.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & bin\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & bin\ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m ruff check src tests scripts main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE -m compileall -q src scripts main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = "$PWD\src"
          & $env:PYTHON_EXE -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE scripts/generate_project_metadata.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE scripts/generate_compliance_manifests.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE scripts/verify_distribution_boundary.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE
        shell: pwsh
        run: |
          $env:PYTHONHASHSEED = "0"
          $env:SOURCE_DATE_EPOCH = "0"
          & $env:PYTHON_EXE -m PyInstaller OpenFetch.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged version and bundled runtimes
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\OpenFetch.exe" -ArgumentList "--version" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Write-Error "Packaged --version smoke test failed with exit code $($process.ExitCode)."
            exit 1
          }
          $archiveListing = & pyi-archive_viewer "dist\OpenFetch.exe" -l
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($runtime in @("bin\\node.exe", "bin\\ffmpeg.exe", "bin\\ffprobe.exe")) {
            if (-not ($archiveListing -match [regex]::Escape($runtime))) {
              Write-Error "Packaged runtime is missing: $runtime"
              exit 1
            }
          }
          & $env:PYTHON_EXE scripts/verify_packaged_licensing.py "dist\OpenFetch.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($smoke in @(
            @{ Name = "runtime"; Argument = "--internal-runtime-smoke" },
            @{ Name = "gui-offscreen"; Argument = "--internal-gui-startup-smoke" },
            @{ Name = "gui-windows"; Argument = "--internal-windows-gui-smoke" },
            @{ Name = "provider-boundary"; Argument = "--internal-provider-media-smoke" },
            @{ Name = "youtube-connection"; Argument = "--internal-youtube-connection-smoke" }
          )) {
            $result = Join-Path $env:RUNNER_TEMP "openfetch-$($smoke.Name)-smoke.json"
            $arguments = "$($smoke.Argument) `"$result`""
            $process = Start-Process -FilePath "dist\OpenFetch.exe" -ArgumentList $arguments -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(60000)) {
              & "$env:SystemRoot\System32\taskkill.exe" /PID $process.Id /T /F | Out-Null
              Write-Error "Packaged $($smoke.Name) smoke timed out; its process tree was terminated."
              exit 1
            }
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $result -PathType Leaf)) {
              Write-Error "Packaged $($smoke.Name) smoke failed."
              exit 1
            }
            $payload = Get-Content -Raw -LiteralPath $result | ConvertFrom-Json
            if ($payload.passed -ne $true) {
              Write-Error "Packaged $($smoke.Name) smoke reported a failed check."
              exit 1
            }
          }

      - name: Rename and checksum
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $exe = "dist\OpenFetch.exe"
          $versioned = "dist\OpenFetch-$version-windows-x64.exe"
          $manifest = "dist\OpenFetch-$version-manifest.json"
          $artifactInventory = "dist\OpenFetch-$version-THIRD_PARTY_LICENSES-artifact-companion.txt"
          $sourceName = "OpenFetch-$version-corresponding-source.zip"
          $sourceInput = "release-assets\$sourceName"
          $sourceOutput = "dist\$sourceName"
          $licenseArchive = "dist\OpenFetch-$version-license-texts.zip"
          if (-not (Test-Path $sourceInput -PathType Leaf)) {
            Write-Error "Validated corresponding-source archive is missing: $sourceInput"
            exit 1
          }
          & $env:PYTHON_EXE scripts/verify_release_companion.py --source-archive $sourceInput --license-directory licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $exe $versioned -Force
          & $env:PYTHON_EXE scripts/verify_packaged_licensing.py $versioned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE scripts/generate_distribution_inventory.py $versioned $artifactInventory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $sourceInput $sourceOutput -Force
          Copy-Item "LICENSE" "dist\LICENSE" -Force
          Copy-Item "THIRD_PARTY_LICENSES.txt" "dist\THIRD_PARTY_LICENSES.txt" -Force
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist\THIRD_PARTY_NOTICES.md" -Force
          Copy-Item "docs\DEPENDENCY-SOURCE.md" "dist\DEPENDENCY-SOURCE.md" -Force
          Compress-Archive -Path "licenses\*" -DestinationPath $licenseArchive -Force
          Get-FileHash $versioned -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $versioned -Leaf)" } |
            Set-Content "$versioned.sha256"
          Get-FileHash $sourceOutput -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $sourceOutput -Leaf)" } |
            Set-Content "$sourceOutput.sha256"
          Get-FileHash $licenseArchive -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $licenseArchive -Leaf)" } |
            Set-Content "$licenseArchive.sha256"
          & $env:PYTHON_EXE scripts/release_tools.py manifest --version $version --exe $versioned --output $manifest --minimum-updater-version 3.0.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
            "OpenFetch.exe",
            "OpenFetch-$version-windows-x64.exe",
            "OpenFetch-$version-windows-x64.exe.sha256",
            "OpenFetch-$version-manifest.json",
            "OpenFetch-$version-THIRD_PARTY_LICENSES-artifact-companion.txt",
            $sourceName,
            "$sourceName.sha256",
            "OpenFetch-$version-license-texts.zip",
            "OpenFetch-$version-license-texts.zip.sha256",
            "LICENSE",
            "THIRD_PARTY_LICENSES.txt",
            "THIRD_PARTY_NOTICES.md",
            "DEPENDENCY-SOURCE.md"
          ) | Sort-Object
          $actual = @(Get-ChildItem dist -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ((Compare-Object $expected $actual).Count -ne 0) {
            Write-Error "Release output does not contain the exact required binary, source, license, notice, checksum, and manifest files."
            Compare-Object $expected $actual | Format-Table
            exit 1
          }
          $notes = "docs\release-notes\V$version.md"
          if (-not (Test-Path $notes -PathType Leaf)) {
            Write-Error "Release notes are missing: $notes"
            exit 1
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFetch-windows-x64
          path: |
            dist/OpenFetch.exe
            dist/OpenFetch-${{ steps.release.outputs.version }}-windows-x64.exe
            dist/OpenFetch-${{ steps.release.outputs.version }}-windows-x64.exe.sha256
            dist/OpenFetch-${{ steps.release.outputs.version }}-manifest.json
            dist/OpenFetch-${{ steps.release.outputs.version }}-THIRD_PARTY_LICENSES-artifact-companion.txt
            dist/OpenFetch-${{ steps.release.outputs.version }}-corresponding-source.zip
            dist/OpenFetch-${{ steps.release.outputs.version }}-corresponding-source.zip.sha256
            dist/OpenFetch-${{ steps.release.outputs.version }}-license-texts.zip
            dist/OpenFetch-${{ steps.release.outputs.version }}-license-texts.zip.sha256
            dist/LICENSE
            dist/THIRD_PARTY_LICENSES.txt
            dist/THIRD_PARTY_NOTICES.md
            dist/DEPENDENCY-SOURCE.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenFetch ${{ steps.release.outputs.tag }}
          body_path: docs/release-notes/V${{ steps.release.outputs.version }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/OpenFetch.exe
            dist/OpenFetch-${{ steps.release.outputs.version }}-windows-x64.exe
            dist/OpenFetch-${{ steps.release.outputs.version }}-windows-x64.exe.sha256
            dist/OpenFetch-${{ steps.release.outputs.version }}-manifest.json
            dist/OpenFetch-${{ steps.release.outputs.version }}-THIRD_PARTY_LICENSES-artifact-companion.txt
            dist/OpenFetch-${{ steps.release.outputs.version }}-corresponding-source.zip
            dist/OpenFetch-${{ steps.release.outputs.version }}-corresponding-source.zip.sha256
            dist/OpenFetch-${{ steps.release.outputs.version }}-license-texts.zip
            dist/OpenFetch-${{ steps.release.outputs.version }}-license-texts.zip.sha256
            dist/LICENSE
            dist/THIRD_PARTY_LICENSES.txt
            dist/THIRD_PARTY_NOTICES.md
            dist/DEPENDENCY-SOURCE.md
