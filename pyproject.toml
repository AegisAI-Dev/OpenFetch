[project]
name = "openfetch"
dynamic = ["version"]
description = "OpenFetch by Brainbyte: open-source media downloader & toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "0xRootNull"}
]
keywords = ["openfetch", "media", "youtube", "downloader", "video", "audio", "subtitles", "thumbnail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp==2026.7.4",
    "PySide6==6.11.1",
    "pillow==12.3.0",
    "requests==2.34.2",
    "youtube-transcript-api==1.2.4",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.21.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.21",
    "mypy==2.3.0",
]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# openfetch.config.VERSION is the single authoritative application version.
[tool.setuptools.dynamic]
version = {attr = "openfetch.config.VERSION"}

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Python 3.10 remains supported; enum.StrEnum is available only in Python 3.11+.
ignore = ["E501", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
